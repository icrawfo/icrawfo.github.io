{% if include.video %}
<div class="media-photo media-photo--{{ include.size }}" style="aspect-ratio: {{ include.ratio | replace: 'x', ' / ' }};">
  <video controls preload="metadata" {% if include.poster %}poster="{{ include.poster | relative_url }}"{% endif %}>
    <source src="{{ include.video | relative_url }}" type="video/mp4">
  </video>
</div>
{% elsif include.src %}
<div class="media-photo media-photo--{{ include.size }}" style="aspect-ratio: {{ include.ratio | replace: 'x', ' / ' }};">
  <img src="{{ include.src | relative_url }}" alt="{{ include.alt | default: include.caption | default: '' }}" loading="lazy">
</div>
{% else %}
<div class="media-placeholder media-placeholder--{{ include.size }}" style="aspect-ratio: {{ include.ratio | replace: 'x', ' / ' }};">
  <svg class="media-placeholder-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
    <rect x="3" y="5" width="18" height="14" rx="2"/>
    <circle cx="9" cy="10" r="2"/>
    <path d="M21 16l-5.5-5.5L11 15l-3-3-4 4"/>
  </svg>
  {% if include.caption %}<p class="media-placeholder-caption">{{ include.caption }}</p>{% endif %}
</div>
{% endif %}
